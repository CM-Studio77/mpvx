name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build MPVX Release APK
        run: ./gradlew --no-daemon :app:assembleLatestUniversalRelease
