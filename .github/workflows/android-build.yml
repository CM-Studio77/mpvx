name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Unlock signing, if keystore secrets are configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build MPVX Release APKs
        run: |
          mkdir -p release-apks
          version="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            ./gradlew --no-daemon :app:assembleLatestUniversalRelease -PabiFilter="$abi"
            apk_file="$(find app/build/outputs/apk/latestUniversal/release -name '*.apk' | head -1)"
            cp "$apk_file" "release-apks/mpvx-player-$version-$abi.apk"
          done
          ./gradlew --no-daemon :app:assembleLatestUniversalRelease
          cp app/build/outputs/apk/latestUniversal/release/mpvx-player-latest-universal-release.apk \
             "release-apks/mpvx-player-$version-universal.apk"
          ls -la release-apks

      - name: Bundle license texts
        run: |
          staging="$(mktemp -d)"
          cp -r licenses "$staging/"
          cp THIRD-PARTY-NOTICES.md "$staging/"
          cp LICENSE "$staging/LICENSE-GPL-3.0.txt"
          (cd "$staging" && zip -qr bundle.zip .)
          mv "$staging/bundle.zip" "release-apks/third-party-licenses.zip"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            release-apks/*.apk
            release-apks/third-party-licenses.zip

      - name: Draft release on tagged builds
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/*.apk
            release-apks/third-party-licenses.zip
          draft: true
          generate_release_notes: true
